stages:
  - lint
  - publish
  - meta

verify-ci-package-needs:
  stage: lint
  script:
    - python3 lib/verify-ci-package-needs.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint-all:
  stage: lint
  before_script:
    - dotnet tool update -g aiursoft.apkg.client --configfile ./nuget.config || dotnet tool install -g aiursoft.apkg.client --configfile ./nuget.config
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - apkg --version
  script:
    - |
      failed=0
      for dir in */; do
        if ls "$dir"*.aosproj >/dev/null 2>&1; then
          echo "::group::Linting $dir"
          (cd "$dir" && apkg lint) || failed=1
          echo "::endgroup::"
        fi
      done
      exit $failed
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH != "master"

# GNOME puts X-GNOME-Settings-Panel entries in a hidden menu directory. ArcMenu
# builds its All Apps view from that menu tree, so standalone applications using
# either of these categories remain searchable but disappear from All Apps.
desktop-entry-policy:
  stage: lint
  script:
    - |
      offenders="$(grep -RIlE \
        --include='*.desktop' \
        '^(X-GNOME-Settings-Panel=|Categories=.*X-GNOME-(Settings-Panel|SystemSettings)(;|$))' \
        . || true)"
      if [ -n "$offenders" ]; then
        echo "Standalone applications must not use GNOME Control Center panel categories:" >&2
        echo "$offenders" >&2
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.publish:
  stage: publish
  before_script:
    - dotnet tool update -g aiursoft.apkg.client --configfile ./nuget.config || dotnet tool install -g aiursoft.apkg.client --configfile ./nuget.config
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - apkg --version
  script:
    - cd "$PACKAGE_DIR"
    - |
      if [ "$CI_COMMIT_BRANCH" = "prod" ]; then
        APKG_SOURCE="https://apkg.aiursoft.com"
        APKG_KEY="$APKG_PROD_API_KEY"
      else
        APKG_SOURCE="https://apkg-dev.aiursoft.com"
        APKG_KEY="$APKG_DEV_API_KEY"
      fi
      apkg deploy \
        --source "$APKG_SOURCE" \
        --api-key "$APKG_KEY" \
        --skip-existing
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "prod"

